name: Build Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - '**/*.py'
  pull_request:  
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: sales-prediction:test

      - name: Test docker image
        run: |
          docker run --rm sales-prediction:test python -c "import lightgbm; import fastapi; print('OK')"
